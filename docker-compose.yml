services:
  webpaper:
    build:
      context: .
      dockerfile: packages/webpaper/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  webtools:
    build:
      context: .
      dockerfile: packages/webtools/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
